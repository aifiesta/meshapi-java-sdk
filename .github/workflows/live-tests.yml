# Java SDK — Live Tests

name: Live Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Staging canary (MESH-368). The MESHAPI_* secrets already point at staging,
    # so this run exercises the live staging API on a fixed cadence — independent
    # of whether anyone opened a PR. One cadence: the full suite, once a day.
    # GitHub cron is UTC-only, so 11:00 IST is expressed as 05:30 UTC.
    - cron: "30 5 * * *"   # daily 11:00 IST — full live suite (gates nothing; report-only)

env:
  MESHAPI_BASE_URL: ${{ secrets.MESHAPI_BASE_URL }}
  MESHAPI_TOKEN: ${{ secrets.MESHAPI_TOKEN }}
  MESHAPI_MODEL: "openai/gpt-4o-mini"
  MESHAPI_EMBEDDINGS_MODEL: "openai/text-embedding-3-small"
  MESHAPI_SECOND_MODEL: "anthropic/claude-haiku-4.5"
  MESHAPI_IMAGE_URL: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"

jobs:
  live-test:
    name: Java SDK Live Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK source (including tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install SDK into local Maven repo
        run: mvn install -DskipTests -q

      # Gating where safe (MESH-368): PRs and pushes run the cheap SMOKE subset
      # (Models/Chat/InferenceResources/Stream/Errors LiveTest) so they gate
      # reliably green — the full suite includes slow/flaky calls (image
      # generation, realtime WebSocket) that intermittently exceed provider
      # latency and shouldn't block unrelated PRs. The FULL suite still runs,
      # just not as a PR gate: on the daily staging cron and on manual
      # workflow_dispatch (e.g. to investigate or confirm a fix).
      - name: Determine suite mode
        id: mode
        if: always()   # compute even if an earlier step failed, so summary/alert still show the suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live tests (${{ steps.mode.outputs.value }})
        working-directory: livetests
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "smoke" ]; then
            mvn test -Dtest=ModelsLiveTest,ChatLiveTest,'InferenceResourcesLiveTest#embeddings_create+responses_create_and_stream',StreamLiveTest,ErrorsLiveTest
          else
            mvn test
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## ☕ Java SDK Live Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }}${{ github.event.schedule && format(' (`{0}`)', github.event.schedule) || '' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | ${{ steps.mode.outputs.value }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | 17 |" >> $GITHUB_STEP_SUMMARY
          echo "| Base URL | \`${{ env.MESHAPI_BASE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Model | \`${{ env.MESHAPI_MODEL }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a  # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Java SDK Live Tests* — ${{ job.status }} · ${{ steps.mode.outputs.value }} suite\nTrigger: `${{ github.event_name }}${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}` · Base URL: `${{ env.MESHAPI_BASE_URL }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · ${{ github.head_ref || github.ref_name }}"
            }
